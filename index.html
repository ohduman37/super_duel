p{font-size:1.15em;margin:0;max-width:86vw;line-height:1.4}
button{font:inherit;font-size:4.2vmin;font-weight:800;padding:1.5vmin 7vmin;border:0;border-radius:5vmin;

.mode span{opacity:.85}

.card.lk{opacity:.45}

.hint2{font-size:.85em;opacity:.7}
#bigstart{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:1em;padding:.8em;background:linear-gradient(0deg,rgba(9,13,19,.98) 60%,rgba(9,13,19,0));z-index:2}

.gi h4{margin:0 0 .25em;font-size:1.2em}
.gi p{font-size:1em;margin:0 0 .4em}
.who{display:flex;flex-wrap:wrap;gap:.3em}
.who i{font-style:normal;font-size:.8em;background:rgba(255,255,255,.1);border-radius:1em;padding:.12em .6em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:.7em}
.how div{background:rgba(255,200,61,.1);border:.12em solid rgba(255,200,61,.4);border-radius:1em;padding:.6em .9em}

#rot{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;background:#0a0e14;color:var(--paper);font-size:5vmin;font-weight:800;padding:8vmin}
@media (orientation:portrait){#rot{display:flex}}
</style>

const RND=(k,v)=>typeof v==='number'?Math.round(v*100)/100:v;
NET.send=function(o){try{if(NET.conn&&NET.conn.open!==false)NET.conn.send(JSON.stringify(o,RND))}catch(e){}};
(function(){for(const n of['sfx','tone','noise','burst','ring','tx']){const f=window[n];NET['o_'+n]=f;window[n]=function(...a){if(NET.on&&NET.role==='host'&&NET.conn&&NET.ev.length<250)NET.ev.push([n,a]);return f.apply(this,a)}}})();
function audioInit(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function netMsg(t){NET.msg=t;if(tab===6&&!NET.on)menu()}
function netPeerOK(){if(NET.test)return true;if(typeof Peer==='undefined'){netMsg('Online için internet gerekli (PeerJS yüklenemedi).');return false}return true}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function netClear(){clearInterval(NET.hb);clearInterval(NET.iv);clearInterval(NET.sv);try{NET.conn&&NET.conn.close()}catch(e){}try{NET.peer&&NET.peer.destroy()}catch(e){}NET.conn=null;NET.peer=null;NET.opp=null;NET.lastMe='';NET.code='';NET.qh=false;NET.quick=false}
// ---- test taşıyıcı (#bc): aynı tarayıcıda iki sekme ----
function bcConn(){const bc=new BroadcastChannel('sd-test');const c={open:true,send:s=>bc.postMessage(s),close:()=>{try{bc.postMessage(JSON.stringify({t:'bye'}))}catch(e){}}};bc.onmessage=e=>netData(e.data);return c}
// ---- oda kur ----
function netHost(pub,quick){audioInit();if(!netPeerOK())return;netClear();NET.role='host';NET.L=0;NET.pub=pub;NET.qh=!!quick;NET.me=A[0];NET.msg='';
  if(NET.test){NET.code='TEST';NET.conn=bcConn();NET.ui='wait';menu();return}
  tryHost(0)}
function tryHost(n){const code=genCode(),p=new Peer('sduello-'+code,PCFG);NET.peer=p;
  p.on('open',()=>{NET.code=code;NET.ui='wait';NET.msg='';if(NET.pub)hbStart();menu()});
  p.on('error',e=>{if(e.type==='unavailable-id'&&n<6){try{p.destroy()}catch(x){}tryHost(n+1)}else{netMsg('Bağlantı hatası: '+e.type);NET.ui='home';menu()}});
  p.on('connection',c=>{if(NET.conn&&NET.conn.open){c.on('open',()=>{c.send(JSON.stringify({t:'full'}));setTimeout(()=>{try{c.close()}catch(e){}},400)});return}
    NET.conn=c;c.on('data',netData);c.on('close',()=>{if(NET.conn===c)netClosed()});c.on('error',()=>{})})}
// ---- odaya katıl ----
function netJoin(code){audioInit();code=String(code||'').trim().toUpperCase();if(!code)return netMsg('Oda kodunu yaz.');if(!netPeerOK())return;netClear();NET.role='guest';NET.L=1;NET.code=code;NET.me=A[0];NET.msg='Bağlanılıyor...';NET.ui='wait';menu();
  if(NET.test){NET.conn=bcConn();netHi();return}
  const p=new Peer(undefined,PCFG);NET.peer=p;
  p.on('open',()=>{const c=p.connect('sduello-'+code,{reliable:true});NET.conn=c;c.on('open',()=>{netHi();NET.msg='';menu()});c.on('data',netData);c.on('close',()=>{if(NET.conn===c)netClosed()})});
  p.on('error',e=>{netClear();NET.ui='home';netMsg(e.type==='peer-unavailable'?'Oda bulunamadı.':'Bağlantı hatası: '+e.type);menu()})}
function myProf(){return{name:A[0],pick:pick[0],cs:U(0).cs,mode:mode,ap:arenaPick,mm:PM[0]}}
function netHi(){const m=myProf();NET.lastMe=JSON.stringify(m);NET.send(Object.assign({t:'hi'},m))}
function netShareMe(){if(!NET.conn||NET.conn.open===false||NET.on)return;const m=myProf();if(NET.role==='guest')delete m.mode,delete m.ap;const j=JSON.stringify(m);if(j!==NET.lastMe){NET.lastMe=j;NET.send(Object.assign({t:'pk'},m))}}
function netClosed(){
  if(NET.on){clearInterval(NET.sv);clearInterval(NET.iv);running=false;$('over').textContent='Rakip bağlantıyı kesti';$('final').textContent='';$('again').style.display='none';$('end').classList.remove('hide');NET.conn=null;return}
  NET.conn=null;NET.opp=null;NET.lastMe='';
  if(NET.role==='host'){NET.msg='Rakip ayrıldı, oda hâlâ açık.';if(NET.pub)hbStart()}else{NET.ui='home';NET.msg='Odadan bağlantı koptu.';netClear()}
  if(tab===6)menu()}
function netLeaveLobby(){if(NET.code&&NET.pub&&NET.role==='host')lbSend({t:'unreg',code:NET.code});netClear();NET.ui='home';NET.msg='';menu()}
function netLeave(){const bak=NET.Abak;try{NET.send({t:'bye'})}catch(e){}netClear();NET.on=false;NET.ui='home';running=false;if(bak){A[0]=bak[0];A[1]=bak[1]}if(NET.pk0!=null)pick[0]=NET.pk0;if(NET.pm0!=null)PM[0]=NET.pm0;fit();$('again').style.display='';$('end').classList.add('hide')}
// ---- mesajlar ----
function netData(raw){let d;try{d=typeof raw==='string'?JSON.parse(raw):raw}catch(e){return}
  if(d.t==='s'){if(NET.role==='guest')applySnap(d);return}
  if(d.t==='in'){if(NET.role!=='host'||!NET.on)return;const c=ctl[1];if(d.qd){if(QT&&QT.w===1)qtIn(d.qd);return}c.dx=d.dx||0;c.dy=d.dy||0;if(d.sh)c.shoot=.22;if(d.us)c.use=true;return}
  if(d.t==='hi'){if(NET.role!=='host')return;if(NET.test&&!NET.conn)NET.conn=bcConn();NET.opp={name:d.name,pick:d.pick,cs:d.cs,mm:d.mm|0};if(NET.pub)lbSend({t:'unreg',code:NET.code});clearInterval(NET.hb);NET.lastMe='';netShareMe();NET.send({t:'pk',name:A[0],pick:pick[0],cs:U(0).cs,mode:mode,ap:arenaPick,mm:PM[0]});NET.lastMe=JSON.stringify(myProf());if(tab===6)menu();return}
  if(d.t==='pk'){NET.opp={name:d.name,pick:d.pick,cs:d.cs,mm:d.mm|0};if(d.mode!=null){mode=d.mode;arenaPick=d.ap}if(tab===6)menu();return}
  if(d.t==='full'){netClear();NET.ui='home';netMsg('Oda dolu.');menu();return}
  if(d.t==='start'){if(NET.role!=='guest')return;matchStart(d.names,d.picks,d.cs,d.mode,d.mm);guestBegin();return}
  if(d.t==='again'){if(NET.role==='host'&&NET.on&&!running)netStart();return}
  if(d.t==='end'){if(NET.role!=='guest')return;running=false;clearInterval(NET.iv);showOnlineEnd(d.wins,d.zs);return}
  if(d.t==='bye'){if(NET.conn)netClosed();return}}
// ---- maç başlat ----
function netStart(){if(!NET.opp)return;const names=[A[0],NET.opp.name],picks=[pick[0],Math.max(0,Math.min(CH.length-1,NET.opp.pick|0))],cs=[U(0).cs,NET.opp.cs|0];
  if(NET.on===false)NET.pk0=pick[0];const mm=[PM[0],NET.opp.mm|0];NET.send({t:'start',names:names,picks:picks,cs:cs,mode:mode,mm:mm});matchStart(names,picks,cs,mode,mm);begin();clearInterval(NET.sv);NET.sv=setInterval(()=>{if(running&&NET.conn)snap()},33)}
function matchStart(names,picks,cs,m,mm){if(!NET.on){NET.Abak=A.slice();NET.pk0=pick[0];NET.pm0=PM[0]}PM[0]=mm?mm[0]|0:0;PM[1]=mm?mm[1]|0:0;NET.names=names;NET.cs=cs;mode=m;A[0]=names[0];A[1]=names[1];pick[0]=picks[0];pick[1]=picks[1];NET.on=true;$('again').style.display='';$('end').classList.add('hide');fit()}
function netAgain(){if(NET.role==='host')netStart();else NET.send({t:'again'})}
function snap(){const s={t:'s',P:P.map(p=>{const o={};for(const k in p)if(k!=='ch')o[k]=p[k];return o}),B:B,Z:Z,G:G,SLS:SLS,ph:phase,pt:pt,rt:rt,rd:round,msg:msg,w:wins,zs:zs,ar:arena,m:mode,sh:shake,FLS:FLS,FLC:FLC,QT:QT,BN:BN,JS:JS,FIN:FIN,HRT:HRT,
  CUT:CUT?{pi:CUT.p.i,t:CUT.t,d:CUT.d,k:CUT.k,nm:CUT.nm,ic:CUT.ic}:null,ev:NET.ev};NET.ev=[];NET.send(s)}
function applySnap(s){if(!running||!P)return;s.P.forEach((o,i)=>Object.assign(P[i],o));B=s.B;Z=s.Z;G=s.G;SLS=s.SLS||[];phase=s.ph;pt=s.pt;rt=s.rt;round=s.rd;msg=s.msg;wins=s.w;zs=s.zs;mode=s.m;if(s.ar!==arena)setArena(s.ar);
  shake=s.sh;FLS=s.FLS;FLC=s.FLC;QT=s.QT;BN=s.BN;JS=s.JS;FIN=s.FIN;HRT=s.HRT;CUT=s.CUT?Object.assign({},s.CUT,{p:P[s.CUT.pi]}):null;
  for(const e of s.ev||[]){try{NET['o_'+e[0]](...e[1])}catch(x){}}}
function guestBegin(){P=[mk(0),mk(1)];PC[0]=P[0].ch.c;PC[1]=P[1].ch.c;PA=[];FX=[];TX=[];G=[];B=[];Z=[];SLS=[];zs=[0,0];wins=[0,0];round=1;phase='count';pt=3.2;FIN=null;QT=null;BN=null;CUT=null;JS=null;FLS=0;running=true;
  ctl.forEach(c=>{c.sid=null;c.use=false;c.shoot=0;c.dx=c.dy=0});resetRound();last=performance.now();NET.acc=0;
  $('menu').classList.add('hide');$('end').classList.add('hide');requestAnimationFrame(gloop)}
function gloop(now){if(!running||NET.role!=='guest')return;if(now-last<FMS-3){requestAnimationFrame(gloop);return}const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const p of P){p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt}for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const p of PA){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*2.2}PA=PA.filter(p=>p.l>0);for(const f of FX){f.r+=(f.m-f.r)*Math.min(1,dt*7);f.l-=dt*1.8}FX=FX.filter(f=>f.l>0);for(const t of TX){t.y-=14*u*dt;t.l-=dt*1.3}TX=TX.filter(t=>t.l>0);
  pt-=dt;if(phase==='fight')rt-=dt;if(FIN)FIN.t+=dt;if(BN)BN.t+=dt;
  const c=ctl[NET.L];c.fp=Math.max(0,c.fp-dt);if(c.sid===null){const k=kv(NET.L);c.dx=k.x;c.dy=k.y}
  NET.acc+=dt;if(NET.acc>=.033){NET.acc=0;NET.send({t:'in',dx:c.dx,dy:c.dy,sh:c.shoot>0?1:0,us:c.use?1:0});if(c.shoot>0)c.shoot=0;c.use=false}
  try{draw();const nw=performance.now()/200;if(BN)drawBN(nw);if(QT)drawQT(nw);if(CUT)drawCut(nw)}catch(e){}requestAnimationFrame(gloop)}
function onlineFinish(){running=false;clearInterval(NET.sv);NET.send({t:'end',wins:wins,zs:zs});showOnlineEnd(wins,zs)}
function showOnlineEnd(w2,z2){running=false;const L=NET.L,w=w2[0]===w2[1]?-1:(w2[0]>w2[1]?0:1),x=DB.users[NET.Abak?NET.Abak[0]:NET.me];let gain=10,t='Berabere!';
  if(w>=0)t=NET.names[w]+' kazandı!';
  if(w===L){gain=Math.round((mode?50:60)*(P&&P[L]&&P[L].ch.ps==='loot'?1.25:1));if(x)x.w++}else if(w>=0){gain=15;if(x)x.l++}
  if(x&&!x.admin)x.coins+=gain;save();
  $('over').textContent=t;$('final').textContent=(mode?'Puan '+(z2[0]|0)+' – '+(z2[1]|0):'Skor '+w2[0]+' – '+w2[1])+'  ·  +'+gain+' 🪙';$('end').classList.remove('hide')}
// ---- oyun arama (kayıt peer'i) ----
const REG='sduello-registry-v1',LBX={peer:null,conn:null,rg:null,rooms:{}};
function lbConnect(done){if(NET.test){done();return}if(typeof Peer==='undefined')return;if(LBX.rg||(LBX.conn&&LBX.conn.open))return done();if(LBX.busy){setTimeout(()=>lbConnect(done),400);return}LBX.busy=true;
  const p=new Peer(undefined,PCFG);LBX.peer=p;
  p.on('open',()=>{const c=p.connect(REG,{reliable:true});c.on('open',()=>{LBX.busy=false;LBX.conn=c;c.on('data',lbData);c.on('close',()=>{LBX.conn=null});done()})});
  p.on('error',e=>{if(e.type==='peer-unavailable'){try{p.destroy()}catch(x){}lbClaim(done)}else LBX.busy=false})}
function lbClaim(done){const p=new Peer(REG,PCFG);
  p.on('open',()=>{LBX.busy=false;LBX.rg=p;p.on('connection',c=>{c.on('data',d=>rgData(c,d));c.on('close',()=>{for(const k in LBX.rooms)if(LBX.rooms[k].c===c)delete LBX.rooms[k]})});done()});
  p.on('error',e=>{LBX.busy=false;if(e.type==='unavailable-id')setTimeout(()=>lbConnect(done),500)})}
function rgData(c,d){const now=Date.now();
  if(d.t==='reg')LBX.rooms[d.code]={info:d.info,ts:now,c:c};
  else if(d.t==='unreg')delete LBX.rooms[d.code];
  else if(d.t==='list'){for(const k in LBX.rooms)if(now-LBX.rooms[k].ts>16000)delete LBX.rooms[k];const list=Object.keys(LBX.rooms).map(k=>({code:k,info:LBX.rooms[k].info}));if(c)c.send({t:'rooms',list:list});else lbData({t:'rooms',list:list})}}
function lbSend(m){if(NET.test){if(m.t==='list')lbData({t:'rooms',list:[]});return}if(LBX.rg)rgData(null,m);else if(LBX.conn&&LBX.conn.open)LBX.conn.send(m)}
function lbData(d){if(d.t!=='rooms')return;NET.list=d.list.filter(r=>r.code!==NET.code);
  if(NET.quick){NET.quick=false;const r=NET.list[0];if(r)netJoin(r.code);else netHost(true,true);return}
  if(NET.qh&&NET.ui==='wait'&&!NET.opp){const r=NET.list.find(r=>r.info&&r.info.q&&r.code<NET.code);if(r){const c=r.code;netClear();netJoin(c);return}}
  if(NET.ui==='search'&&tab===6)menu()}
function hbStart(){clearInterval(NET.hb);const f=()=>{if(!NET.code||NET.opp)return;lbConnect(()=>{lbSend({t:'reg',code:NET.code,info:{n:A[0],ic:CH[pick[0]].ic,m:mode,q:NET.qh?1:0}});if(NET.qh)lbSend({t:'list'})})};f();NET.hb=setInterval(f,4000)}
function netSearch(){audioInit();NET.ui='search';NET.msg='';NET.list=[];menu();const f=()=>{if(NET.ui!=='search'||tab!==6)return clearInterval(NET.sr);lbConnect(()=>lbSend({t:'list'}))};f();clearInterval(NET.sr);NET.sr=setInterval(f,3000)}
function netQuick(){audioInit();if(!netPeerOK())return;NET.msg='Rakip aranıyor...';NET.ui='search';NET.quick=true;menu();lbConnect(()=>lbSend({t:'list'}))}
// ---- arayüz ----
function onlineUI(){let h='';NET.me=A[0];
  h+='<div class="step">🌐 Online oyun <small>— hesabın: '+A[0]+'. İki oyuncu da kendi cihazından oynar.</small></div>';
  if(NET.msg)h+='<b style="color:#ffc83d;font-size:1.2em;text-align:center">'+NET.msg+'</b>';
  if(NET.ui==='home'){
    h+='<div class="step"><b>1</b> Oyun modunu seç <small>(odayı kuran seçer)</small></div><div class="modes">'+MODES.map((m,k)=>'<div class="mode'+(mode===k?' on':'')+'" onclick="mode='+k+';menu()"><b>'+m[0]+' '+m[1]+'</b><span>'+m[2]+'</span></div>').join('')+'</div>';
    h+='<div class="step"><b>2</b> Arena <small>(odayı kuran seçer)</small></div><div class="chips">'+[...AR,{ic:'🎲',n:'Rastgele'}].map((a,k)=>'<div class="chip'+(arenaPick===k?' on':'')+'" onclick="arenaPick='+k+';menu()">'+a.ic+' '+a.n+'</div>').join('')+'</div>';
    h+='<div class="step"><b>3</b> Nasıl oynamak istersin?</div><div class="row"><button class="mini" onclick="netQuick()">⚡ Hızlı eşleş</button><button class="mini" onclick="netHost(true)">🏠 Herkese açık oda kur</button><button class="mini sec" onclick="netHost(false)">🔒 Özel oda kur</button><button class="mini sec" onclick="netSearch()">🔎 Oyun ara</button></div>';
    h+='<div class="row"><input id="rc" placeholder="Oda kodu (örn: K7QF)" maxlength="4" value="'+NET.rcv+'" oninput="NET.rcv=this.value" style="width:11em"><button class="mini" onclick="netJoin($(\'rc\').value)">Kodla katıl</button></div>';
    h+='<div class="step"><b>★</b> Karakterin</div>'+detail(0)+picker(0)}
  else if(NET.ui==='search'){
    h+='<div class="step">🔎 Açık odalar <small>— 3 saniyede bir yenilenir</small></div>';
    h+=NET.list.length?'<div class="shop">'+NET.list.map(r=>'<div class="sc" style="--c:#4fc3f7"><b>'+(r.info.ic||'')+' '+r.info.n+'</b><small>'+MODES[r.info.m||0][0]+' '+MODES[r.info.m||0][1]+'</small><small>Kod: '+r.code+'</small><button class="mini" onclick="netJoin(\''+r.code+'\')">Katıl</button></div>').join('')+'</div>':'<p style="text-align:center">'+(NET.quick?'Eşleşme aranıyor...':'Şu an açık oda yok. “Herkese açık oda kur” ile sen kur, rakip seni bulsun.')+'</p>';
    h+='<div class="row"><button class="mini sec" onclick="NET.quick=false;NET.ui=\'home\';NET.msg=\'\';menu()">← Geri</button></div>'}
  else{
    h+='<div class="step">'+(NET.role==='host'?'🏠 Odan hazır':'🔗 Odaya bağlandın')+'</div>';
    if(NET.role==='host')h+='<div class="box" style="align-self:center"><small>Oda kodu (arkadaşına söyle)</small><b style="font-size:3.4em;letter-spacing:.2em;color:#ffc83d">'+NET.code+'</b><small>'+(NET.pub?'Herkese açık: “Oyun ara”da görünür':'Özel oda: sadece kodu bilen girebilir')+'</small></div>';
    else h+='<div class="box" style="align-self:center"><small>Oda</small><b style="font-size:2.4em;letter-spacing:.2em;color:#ffc83d">'+NET.code+'</b></div>';
    h+=NET.opp?'<p style="text-align:center;font-size:1.3em">Rakip: <b>'+NET.opp.name+'</b> · '+CH[NET.opp.pick].ic+' '+CH[NET.opp.pick].n+'</p>':'<p style="text-align:center;font-size:1.2em">⏳ Rakip bekleniyor...</p>';
    if(NET.role==='host'&&NET.opp)h+='<div class="row"><small>Mod: '+MODES[mode][0]+' '+MODES[mode][1]+'</small></div>';
    if(NET.role==='guest'&&NET.opp)h+='<div class="row"><small>Mod: '+MODES[mode][0]+' '+MODES[mode][1]+' (odayı kuran seçti)</small></div>';
    h+='<div class="step"><b>★</b> Karakterin</div>'+detail(0)+picker(0);
    h+='<div class="row"><button class="mini sec" onclick="netLeaveLobby()">← Odadan çık</button></div>'}
  return h}
function onlineFoot(){if(NET.ui==='wait'&&NET.role==='host'&&NET.opp&&NET.conn)return '<button onclick="netStart()">▶ BAŞLAT</button>';if(NET.ui==='wait'&&NET.role==='guest'&&NET.opp)return '<button class="sec" style="font-size:3vmin">Odayı kuran başlatınca oyun açılır…</button>';return ''}
addEventListener('beforeunload',()=>{try{if(NET.code&&NET.pub)lbSend({t:'unreg',code:NET.code})}catch(e){}});

fit();
</script>
